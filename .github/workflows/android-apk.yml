name: IPPO Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm install

      - name: Expo doctor
        run: npx expo-doctor

      - name: Build Android APK with EAS
        run: npx eas-cli build -p android --profile preview --non-interactive
