name: IPPO Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Initialize EAS project
        run: |
          if ! grep -q '"projectId"' app.json; then
            npx eas-cli init --account prof.axes --non-interactive
          else
            echo "EAS project already configured."
          fi

      - name: Persist EAS project configuration
        run: |
          if git diff --quiet -- app.json; then
            echo "No EAS configuration changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "Configure EAS project"
            git push origin HEAD:main
          fi

      - name: Expo doctor
        run: npx expo-doctor

      - name: Build Android APK with EAS
        run: npx eas-cli build -p android --profile preview --non-interactive --wait
